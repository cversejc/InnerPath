# FastAPI应用
[program:innerseek-api]
command=/var/www/innerseek/backend/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 4
directory=/var/www/innerseek/backend
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/innerseek/api.log
stderr_logfile=/var/log/innerseek/api.error.log
environment=PATH="/var/www/innerseek/backend/venv/bin"

# Celery Worker
[program:innerseek-celery]
command=/var/www/innerseek/backend/venv/bin/celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
directory=/var/www/innerseek/backend
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/innerseek/celery.log
stderr_logfile=/var/log/innerseek/celery.error.log
environment=PATH="/var/www/innerseek/backend/venv/bin"
stopwaitsecs=600

# Celery Beat (定时任务，可选)
[program:innerseek-celery-beat]
command=/var/www/innerseek/backend/venv/bin/celery -A app.tasks.celery_app beat --loglevel=info
directory=/var/www/innerseek/backend
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/innerseek/celery-beat.log
stderr_logfile=/var/log/innerseek/celery-beat.error.log
environment=PATH="/var/www/innerseek/backend/venv/bin"

[group:innerseek]
programs=innerseek-api,innerseek-celery,innerseek-celery-beat
