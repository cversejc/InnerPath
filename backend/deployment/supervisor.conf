# FastAPI应用
[program:innerpath-api]
command=/var/www/innerpath/backend/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 4
directory=/var/www/innerpath/backend
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/innerpath/api.log
stderr_logfile=/var/log/innerpath/api.error.log
environment=PATH="/var/www/innerpath/backend/venv/bin"

# Celery Worker
[program:innerpath-celery]
command=/var/www/innerpath/backend/venv/bin/celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
directory=/var/www/innerpath/backend
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/innerpath/celery.log
stderr_logfile=/var/log/innerpath/celery.error.log
environment=PATH="/var/www/innerpath/backend/venv/bin"
stopwaitsecs=600

# Celery Beat (定时任务，可选)
[program:innerpath-celery-beat]
command=/var/www/innerpath/backend/venv/bin/celery -A app.tasks.celery_app beat --loglevel=info
directory=/var/www/innerpath/backend
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/innerpath/celery-beat.log
stderr_logfile=/var/log/innerpath/celery-beat.error.log
environment=PATH="/var/www/innerpath/backend/venv/bin"

[group:innerpath]
programs=innerpath-api,innerpath-celery,innerpath-celery-beat
