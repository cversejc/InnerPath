services:
  postgres:
    image: postgres:15-alpine
    container_name: innerpath-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-innerpath}
      POSTGRES_USER: ${POSTGRES_USER:-innerpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-innerpath123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - innerpath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-innerpath}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: innerpath-redis
    ports:
      - "6379:6379"
    networks:
      - innerpath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: innerpath-backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-innerpath}:${POSTGRES_PASSWORD:-innerpath123}@postgres:5432/${POSTGRES_DB:-innerpath}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend/logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - innerpath-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: innerpath-celery
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-innerpath}:${POSTGRES_PASSWORD:-innerpath123}@postgres:5432/${POSTGRES_DB:-innerpath}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - innerpath-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: innerpath-frontend
    ports:
      - "80:80"
      - "443:443"
    networks:
      - innerpath-network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  innerpath-network:
    driver: bridge
